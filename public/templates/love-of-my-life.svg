    </style>
  </defs>
  <rect width="736" height="1308" fill="#e9e1dc"/>
  <image href="love-paper-texture.webp" x="0" y="0" width="736" height="1308" preserveAspectRatio="xMidYMid slice" opacity=".96"/>
  <image href="love-cats.webp" x="362" y="64" width="346" height="auto" preserveAspectRatio="xMidYMin meet"/>
  <image href="love-of-my-life-art.webp" x="25" y="225" width="224" height="auto" preserveAspectRatio="xMinYMin meet" transform="rotate(-13 25 225)"/>
  <image href="love-favorite-person-art.webp" x="594" y="580" width="173" height="auto" preserveAspectRatio="xMinYMin meet" transform="rotate(78 594 580)"/>
