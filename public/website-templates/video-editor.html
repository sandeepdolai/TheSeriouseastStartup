<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Editor</title>
<style>
:root{--bg:#09090c;--panel:#0f0f13;--chip:#1b1b20;--line:#2b2b32;--fg:#f5f5f7;--mut:#8b8b95;--acc:#7a64f5;--txt:#f0f;--mh:44px;--g:66px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:500 14px/1.2 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
i{font-style:normal;display:flex}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 10px 12px}
.pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:var(--chip);border:1px solid var(--line);font-size:15px;white-space:nowrap}
.pill svg{width:18px;height:18px}
.back{width:44px;padding:0;justify-content:center}
.back svg{width:22px;height:22px}
.exp{background:#fff;color:#111;border-color:#fff;font-weight:600}
.undo{display:flex;gap:16px}
.dis{opacity:.35;pointer-events:none}
.sp{flex:1}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:#000}
.cv{container-type:size;position:relative;width:100%;height:100%;background:#fff;display:grid;place-items:center;overflow:hidden}
.txt{color:var(--txt);font:400 clamp(40px,9cqw,120px)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.hid .txt,.hid .mi{opacity:0}
.vh .m{opacity:.35;filter:grayscale(1)}
.eye.off{background:#2a2552;color:#c4baff}
.mi{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.ot{position:absolute;left:50%;top:74%;translate:-50% -50%;display:none;color:#111;font:600 clamp(18px,4.5cqw,44px)/1.1 "Helvetica Neue",Helvetica,Arial,sans-serif;white-space:nowrap;outline:0;padding:2px 8px;user-select:text;-webkit-user-select:text}
.ot[contenteditable=true]{outline:1.5px dashed var(--acc)}
.shade{position:absolute;inset:auto 0 0;height:100px;background:linear-gradient(transparent,rgba(0,0,0,.5));pointer-events:none}
.tm{position:absolute;left:14px;bottom:14px;font-size:15px;font-variant-numeric:tabular-nums;color:#fff}
.tm span{color:#b4b4bc}
.pl{position:absolute;left:50%;bottom:10px;translate:-50% 0;width:52px;height:42px;border-radius:21px;background:rgba(58,58,62,.92);display:grid;place-items:center;color:#fff}
.pl svg{fill:#fff;stroke:none}
.fs{position:absolute;right:12px;bottom:12px;width:36px;height:36px;display:grid;place-items:center;color:#fff}
.fs svg{width:22px;height:22px}
.tl{background:var(--panel);padding:8px 0 12px;position:relative}
.eye{position:absolute;left:calc(var(--g)/2 - 22px);top:calc(42px + (var(--mh) - 38px)/2);z-index:3;width:44px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center}
.eye svg{width:22px;height:22px}
.sc{margin-left:var(--g);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;-webkit-touch-callout:none}
.sc::-webkit-scrollbar{display:none}
.lane{position:relative}
.rul{height:34px;position:relative;color:var(--mut);font-size:13px}
.rul span{position:absolute;top:0;translate:-50% 0;white-space:nowrap}
.rul u{position:absolute;bottom:4px;width:1px;height:5px;background:#3a3a42}
.rul u.m{height:8px}
.row{position:relative;height:var(--mh)}
.rt{height:30px;margin-top:8px}
.ra{height:32px;margin-top:8px}
.c{position:absolute;top:0;bottom:0}
.in{height:100%;border-radius:12px;overflow:hidden}
.in svg{width:16px;height:16px;flex:none}
.m .in{border:3px solid var(--acc);background:#fff;display:flex;box-shadow:0 0 16px #7a64f566}
.tile{flex:1;display:grid;place-items:center;color:var(--txt);font-size:12px;border-right:1px solid #ece9f8;white-space:nowrap;overflow:hidden}
.t .in,.a .in{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;white-space:nowrap;border:2px solid transparent}
.t .in{background:#2f2d52;color:#d8d3ff}
.a .in{background:#12383a;color:#9ff0e0;background-image:repeating-linear-gradient(90deg,#9ff0e044 0 2px,transparent 2px 6px);background-size:100% 55%;background-repeat:no-repeat;background-position:center}
.tile.mt{background-size:cover;background-position:center}
.c.on .in{border-color:#fff}
.dur{position:absolute;left:8px;bottom:5px;z-index:1;font-style:normal;font-size:11px;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:8px;pointer-events:none}
.snap{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#ffd24a;z-index:3;pointer-events:none}
.tip{position:absolute;top:2px;translate:-50% 0;background:#fff;color:#111;border-radius:10px;padding:2px 8px;font-size:12px;z-index:5;pointer-events:none}
.fit{position:absolute;right:8px;top:6px;width:28px;height:28px;border-radius:14px;background:var(--chip);display:grid;place-items:center;z-index:3;color:var(--mut)}
.fit svg{width:16px;height:16px}
.cmp .rul{opacity:0}
.cmp .rt,.cmp .ra{opacity:.3}
.cmp .h{display:none}
.lift{z-index:4}
.lift .in{box-shadow:0 8px 24px #000b;scale:1.05}
.h{position:absolute;top:-3px;bottom:-3px;width:18px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ew-resize;z-index:2}
.h.l{left:-9px}
.h.r{right:-9px}
.h::after{content:"";width:3px;height:18px;border-radius:2px;background:#fff}
.plus{position:absolute;top:0;height:100%;width:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center}
.aud{position:absolute;top:0;height:32px;border-radius:12px;background:var(--chip);display:flex;align-items:center;gap:12px;padding:0 14px;color:var(--mut);font-size:15px;cursor:pointer}
.aud svg{width:20px;height:20px}
.ph{position:absolute;top:0;bottom:0;left:calc(var(--g) + (100% - var(--g))/2);width:2px;margin-left:-1px;background:#fff;border-radius:1px;pointer-events:none;z-index:2}
.ph::before{content:"";position:absolute;top:20px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff}
.bar{background:var(--panel);display:flex;flex-wrap:wrap;padding:14px 8px 8px;border-radius:26px 26px 0 0}
.ebar{display:none}
.es .bar{display:none}
.es .ebar{display:flex}
.tool{width:20%;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0;font-size:13.5px;border-radius:16px;color:var(--fg)}
.ebar .tool{flex:1;width:auto}
.tool.add{width:auto;margin:0 6px 0 auto;padding:10px 14px;background:var(--chip)}
.bar:not(.ebar){justify-content:center;gap:12px}
.bar:not(.ebar) .tool{flex:0 0 96px;width:96px;margin:0}
.bar:not(.ebar) .tool.add{flex:0 0 auto;width:auto;padding:10px 20px}
.toast{width:max-content;max-width:86vw;text-align:center;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);translate:-50% 0;background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.s{opacity:1}
.fi0{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:72dvh;background:var(--panel);border-radius:26px 26px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:sl .22s ease}
@keyframes sl{from{transform:translateY(100%)}}
.hdr{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.hdr button{width:34px;height:34px;display:grid;place-items:center;border-radius:17px;background:var(--chip)}
.hdr svg{width:18px;height:18px}
.upb{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;border-radius:16px;background:var(--acc);color:#fff;font-weight:600;font-size:16px}
.upb svg{width:22px;height:22px}
.lst{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--chip)}
.pp{width:36px;height:36px;border-radius:18px;background:#2b2b32;display:grid;place-items:center;flex:none}
.pp svg{width:16px;height:16px;fill:#fff;stroke:none}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:15px}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mut);font-size:12px}
.ad{padding:8px 16px;border-radius:16px;background:#fff;color:#111;font-weight:600;font-size:14px}
.em{color:var(--mut);text-align:center;padding:16px 0;font-size:14px}
.panel{height:86dvh;max-height:none;gap:12px;padding-top:12px}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#3a3a42;flex:none}
.srch{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:24px;background:var(--chip);color:var(--mut);flex:none}
.srch svg{width:22px;height:22px}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:17px;-webkit-appearance:none}
.srch input::placeholder{color:var(--mut)}
.chips{display:flex;gap:8px;flex:none}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;background:var(--chip);font-size:15px}
.chip svg{width:16px;height:16px}
.chip.on{background:#2a2552;color:#c4baff}
.li{background:none;padding:8px 6px;gap:14px;cursor:pointer}
.li.sel{background:#17171c}
.cv2{width:54px;height:54px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.cv2 svg{width:22px;height:22px}
.sel .cv2 svg{fill:#fff;stroke:none}
.nm span{font-size:16px;font-weight:600}
.nm small{font-size:14px}
.bm{width:40px;height:40px;display:grid;place-items:center;flex:none}
.bm svg{width:26px;height:26px}
.bm.on svg{fill:currentColor}
.upc{background:var(--acc)}
@media(min-width:760px){.panel{height:80dvh}}
@media(min-width:760px){.panel{left:50%;right:auto;width:520px;translate:-50% 0;bottom:24px;border-radius:26px}}
@media(min-width:760px){.back{display:flex}}
@media(min-width:760px){
:root{--mh:70px;--g:96px}
.back,.shade{display:none}
.undo{display:flex}
.top{padding:12px 14px}
.cv{width:min(100%,calc((100dvh - 350px)*1.78));height:auto;aspect-ratio:16/9}
.tile{font-size:16px}
.bar{border-radius:0;padding:10px 20px;flex-wrap:nowrap}
.tool{width:auto;flex:1}
.tool.add{flex:0 0 78px;margin:0}
.sep{display:block;width:1px;height:48px;background:var(--line);align-self:center;margin:0 14px}
.tm{left:22px}
.fs{right:22px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="pill back" data-i="back" aria-label="Back"></button>
    
    <div class="sp"></div>
    <div class="pill undo"><button data-i="undo" aria-label="Undo" id="un"></button><button data-i="redo" aria-label="Redo" id="re"></button></div>
    
    
  </header>

  <main class="stage" id="stage">
    <div class="cv" id="cv"><div class="txt" id="txt">Photo 3</div><img class="mi" id="pi" alt=""><video class="mi" id="pv" playsinline preload="auto"></video><div class="ot" id="ot"></div></div>
    <div class="shade"></div>
    <div class="tm" id="tm"></div>
    <button class="pl" id="pl" aria-label="Play"></button>
    <button class="fs" id="fs" data-i="full" aria-label="Fullscreen"></button>
  </main>

  <section class="tl">
    <button class="eye" id="eye" data-i="eye" aria-label="Toggle track"></button>
    <div class="sc" id="sc"><div class="lane" id="lane"></div></div>
    <button class="fit" id="fit" data-i="fit" aria-label="Fit timeline"></button>
    <div class="ph"></div>
  </section>

  <nav class="bar">
    <button class="tool" data-i="cut" data-k="edit">Edit</button>
    <button class="tool" data-i="note" data-k="audio">Audio</button>
    
    
    
    
    
    
    
    
    <button class="tool add" data-i="plus" data-k="add">Add</button>
  </nav>
  <nav class="bar ebar">
    <button class="tool" data-i="cut" data-a="split">Split</button>
    <button class="tool" data-i="copy" data-a="dup">Duplicate</button>
    <button class="tool" data-i="pen" data-a="edit" id="etx">Edit text</button>
    <button class="tool" data-i="trash" data-a="del">Delete</button>
    <button class="tool" data-i="check" data-a="done">Done</button>
  </nav>
</div>
<div class="toast" id="tt"></div>
<input type="file" id="pick" accept="image/*,video/*" multiple class="fi0">
<div class="sheet" id="lib">
  <div class="scrim" id="lx"></div>
  <div class="panel">
    <i class="grab" id="gb"></i>
    <label class="srch" data-i="search"><input id="sq" type="search" placeholder="Search…" autocomplete="off"></label>
    <div class="chips"><button class="chip on" id="cf">For you</button><button class="chip" id="cu" data-i="up">Upload</button></div>
    
    <div class="lst" id="ll"></div>
  </div>
</div>
<input type="file" id="aup" accept="audio/*" multiple class="fi0">

<script>
const I={
back:'<path d="M19 12H5m7 7-7-7 7-7"/>',
layers:'<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m22 17-10 5-10-5"/><path d="m22 12-10 5-10-5"/>',
chev:'<path d="m6 9 6 6 6-6"/>',
up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
undo:'<path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
redo:'<path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
play:'<path d="M8 5v14l11-7z"/>',
pause:'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>',
full:'<path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
note:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
cut:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
type:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',
stick:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
blend:'<circle cx="12" cy="8" r="4.5"/><circle cx="8" cy="14.5" r="4.5"/><circle cx="16" cy="14.5" r="4.5"/>',
spark:'<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
caps:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8v5l4-2.5zM8 21h8"/>',
adj:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
asp:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 9h5V3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>',
check:'<path d="m5 12 5 5 9-10"/>',
fit:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
bm:'<path d="M6 3h12v18l-6-4.5L6 21z"/>',
eyeoff:'<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/>'};
const svg=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const $=s=>document.querySelector(s),q=s=>[...document.querySelectorAll(s)];
q('[data-i]').forEach(e=>e.insertAdjacentHTML('afterbegin',svg(e.dataset.i)));
const app=$('.app'),sc=$('#sc'),lane=$('#lane'),txt=$('#txt'),ot=$('#ot'),tm=$('#tm'),pl=$('#pl'),tt=$('#tt');
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const esc=s=>s.replace(/[&<>]/g,m=>'&#'+m.charCodeAt(0)+';');
let S={main:[{id:1,l:'Photo 3',d:5}],text:[],aud:[],sel:0,pn:3},t=0,on=false,L=0,W=0,G=null,U=[],Y=[],N=10,pps=innerWidth>=760?110:60;
const DM=()=>S.main.reduce((a,c)=>a+c.d,0);
const D=()=>Math.max(DM(),...S.text.map(c=>c.s+c.d),...S.aud.map(c=>c.s+c.d));
const find=id=>{for(const k of['main','text','aud']){const c=S[k].find(c=>c.id===id);if(c)return{c,k}}};
const start=id=>{let x=0;for(const c of S.main){if(c.id===id)return x;x+=c.d}};
function at(v){let x=0;for(const c of S.main){if(v<x+c.d)return c;x+=c.d}return S.main[S.main.length-1]||{id:0,l:''}}
function toast(m,ms){tt.textContent=m;tt.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>tt.classList.remove('s'),ms||1800)}

/* history */
const H=()=>{U.push(JSON.stringify(S));Y=[];if(U.length>60)U.shift()};
const fix=()=>{select(S.sel);t=cl(t,0,D());render();sc.scrollLeft=t*pps;draw()};
const undo=()=>{if(U.length){Y.push(JSON.stringify(S));S=JSON.parse(U.pop());fix()}};
const redo=()=>{if(Y.length){U.push(JSON.stringify(S));S=JSON.parse(Y.pop());fix()}};

/* timeline render */
function render(){
  W=sc.clientWidth;const cmp=G&&G.k==='mv'&&G.f.k==='main',pad=W/2,d=D(),big=innerWidth>=760,ls=pps>=40?1:pps>=22?2:5;
  let r='',x=0,m='',tx='',au='';
  for(let k=0;k*ls/2<=d+pad/pps;k++){const s=k*ls/2,l=`left:${pad+s*pps}px`;r+=k%2?`<u style="${l}"></u>`:`<span style="${l}">${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</span><u class="m" style="${l}"></u>`}
  const hd='<b class="h l" data-h="l"></b><b class="h r" data-h="r"></b>';
  const cls=c=>(S.sel===c.id?' on':'')+(G&&G.k==='mv'&&G.id===c.id?' lift':'');

    return`<div class="li${on?' sel':''}" data-p="${x.k}"><div class="cv2" style="background:linear-gradient(135deg,hsl(${h},70%,58%),hsl(${(h+50)%360},70%,30%))">${svg(on?'pause':'note')}</div><div class="nm"><span>${esc(x.n)}</span><small>${esc(x.a||'Your upload')} • ${dm(x.d)}</small></div>${on?`<button class="ad" data-a="${x.k}">Add</button>`:''}<button class="bm${saved.has(x.k)?' on':''}" data-b="${x.k}" aria-label="Save">${svg('bm')}</button></div>`};
  const top=up?`<div class="li" data-up="1"><div class="cv2 upc">${svg('up')}</div><div class="nm"><span>Upload from device</span><small>Choose audio files from your device</small></div></div>`:'';
  ll.innerHTML=top+(L.length?L.map(row).join(''):`<div class="em">${v?'No results for “'+esc(v)+'”':up?'Your uploads will appear here':'No audio yet'}</div>`)}
ll.onclick=e=>{const b=e.target.closest('[data-b]'),a=e.target.closest('[data-a]'),u=e.target.closest('[data-up]'),r=e.target.closest('[data-p]');
  if(u)openPick(aup);
  else if(b){const k=b.dataset.b;saved.has(k)?saved.delete(k):saved.add(k);renderLib()}
  else if(a)addAud([lf(a.dataset.a)]);
  else if(r){const k=r.dataset.p,x=lf(k),same=pk===k;stopPrev();if(!same){pa=new Audio(x.src);pk=k;pa.onended=()=>{pk=null;renderLib()};pa.play().catch(()=>{})}renderLib()}};
aup.onchange=async()=>{const fs=[...aup.files],xs=[];aup.value='';
  for(const f of fs){const src=URL.createObjectURL(f),d=await adur(src);if(d>0){const x={k:'a'+(++N),n:f.name.replace(/\.[^.]+$/,''),d,src};x.up=1;LIB.unshift(x);xs.push(x)}else toast('Couldn’t read '+f.name)}
  if(xs.length){tab='u';renderLib();toast(xs.length>1?'Uploaded '+xs.length+' tracks':'Uploaded')}};
function asy(){for(const id in AU)if(!S.aud.some(c=>c.id==id)){AU[id].pause();delete AU[id]}
  S.aud.forEach(c=>{const x=c.m&&lf(c.m);if(!x)return;const a=AU[c.id]||(AU[c.id]=new Audio(x.src)),w=(c.so||0)+t-c.s;
    if(on&&t>=c.s&&t<c.s+c.d&&w<x.d-.05){if(a.paused){a.currentTime=w;a.play().catch(()=>{})}else if(Math.abs(a.currentTime-w)>.4)a.currentTime=w}else if(!a.paused)a.pause()})}
$('#eye').onclick=()=>{const h=$('#cv').classList.toggle('hid'),b=$('#eye');$('.tl').classList.toggle('vh',h);b.classList.toggle('off',h);b.setAttribute('aria-pressed',h);b.innerHTML=svg(h?'eyeoff':'eye');toast(h?'Video hidden':'Video visible')};
$('#fs').onclick=()=>{try{const s=$('#stage');(s.requestFullscreen||s.webkitRequestFullscreen).call(s)}catch(e){}};

$('.back').onclick=()=>window.parent.postMessage({source:'paper-stish-memory-lane-video-editor',type:'close'},'*');
render();setPlay();draw();select(0);
</script>
