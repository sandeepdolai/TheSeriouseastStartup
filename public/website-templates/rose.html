<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#200505">
<title>Rose — Paper Stish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--base:#200505;--text:#f5e8e4;--muted:#d1a7a1;--rose-glow:#79130f;--rose-mid:#470a08;--rose-dark:#250505;--rose-deep:#160202;--rose-accent:#ffd0c8;--rose-muted:#d1a7a1}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100svh;overflow-x:hidden;overflow-y:auto;font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 42%,var(--rose-glow) 0,var(--rose-mid) 30%,var(--rose-dark) 63%,var(--rose-deep) 100%)}
.scene-wash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 20%,rgba(10,0,0,.12) 72%,rgba(0,0,0,.28) 100%)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.layout{position:relative;display:grid;place-items:center;width:100%;min-height:100svh;padding:max(34px,env(safe-area-inset-top)) 18px max(42px,env(safe-area-inset-bottom))}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.content-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:min(100%,440px);margin:auto}
.viewer{position:relative;z-index:1;inset:auto;left:auto;top:auto;transform:none;width:100%;height:420px;flex:none;touch-action:pan-y;cursor:default;pointer-events:none}
canvas{display:block;width:100%;height:100%}
.box{position:relative;z-index:2;inset:auto;left:auto;bottom:auto;transform:none;width:100%;max-width:440px;min-height:0;margin:0;padding:24px 22px;border-radius:28px;text-align:center;background:rgba(20,3,3,.38);border:1px solid rgba(255,150,130,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 24px 60px rgba(0,0,0,.3);pointer-events:none;text-shadow:0 2px 24px rgba(10,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.box h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.025em;text-transform:none;padding:0;line-height:1.35;overflow-wrap:anywhere;outline:none!important;border:0}
.rose-message{max-width:30ch;margin:12px auto 0;color:var(--muted);font-size:15px;font-weight:400;line-height:1.6;letter-spacing:.005em;outline:none!important;border:0}
[contenteditable="true"],[contenteditable="true"]:focus,[contenteditable="true"]:focus-visible{pointer-events:auto;cursor:text;border:0;outline:none!important;box-shadow:none}
[contenteditable="false"]{outline:none;border:0;cursor:default}
@media(max-width:360px){.box{padding:24px 18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="scene-wash" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<div class="layout rose-card-layout">
  <div class="sr-only" id="modelStatus" role="status" aria-live="polite"></div>
  <div class="content-stack">
    <div class="viewer" id="viewer" aria-label="Three-dimensional rose rotating automatically"><canvas id="roseCanvas"></canvas></div>
    <main class="box">
      <h1 id="roseHeading">We’re sorry, sir. Your order will be delivered shortly.</h1>
      <p class="rose-message" id="roseMessage" hidden></p>
    </main>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
(() => {
  "use strict";
  const FRAME_SOURCE = "paper-stish-rose";
  const PARENT_SOURCE = "paper-stish-rose-parent";
  const MODEL_URL = "https://res.cloudinary.com/cmtfrr9s/image/upload/v1793144811/rose_2.glb";
  const DEFAULT_HEADING = "We’re sorry, sir. Your order will be delivered shortly.";
  const heading = document.getElementById("roseHeading");
  const message = document.getElementById("roseMessage");
  const modelStatus = document.getElementById("modelStatus");
  const viewer = document.getElementById("viewer");
  const canvas = document.getElementById("roseCanvas");
  let editing = false;
  let state = { heading: DEFAULT_HEADING, message: "" };
  let loader = null;
  let modelLoadAttempted = false;
  let modelLoaded = false;
  let entranceStart = 0;
  // Hold the reference-facing angle through the entrance; rotation begins only after it settles.
  let rotateX = -0.08, rotateY = 0;
  let raf = 0, renderer = null, camera = null, scene = null, rose = null, entrance = null;
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function setEditing(value) {
    editing = value === true;
    [heading, message].forEach((element) => {
      element.contentEditable = editing ? "true" : "false";
      element.setAttribute("aria-readonly", editing ? "false" : "true");
      element.setAttribute("spellcheck", editing ? "true" : "false");
    });
  }

  function reportChange() {
    if (!editing) return;
    state.heading = (heading.textContent || DEFAULT_HEADING).replace(/[\r\n]+/g, " ").trim().slice(0, 120);
    state.message = (message.textContent || "").replace(/[\r\n]+/g, " ").trim().slice(0, 400);
    window.parent.postMessage({ source: FRAME_SOURCE, type: "change", heading: state.heading, message: state.message }, "*");
  }
  heading.addEventListener("input", reportChange);
  message.addEventListener("input", reportChange);

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent || !event.data || event.data.source !== PARENT_SOURCE || event.data.type !== "set-state") return;
    state.heading = typeof event.data.heading === "string" ? event.data.heading.slice(0, 120) : DEFAULT_HEADING;
    state.message = typeof event.data.message === "string" ? event.data.message.slice(0, 400) : "";
    if (document.activeElement !== heading) heading.textContent = state.heading || DEFAULT_HEADING;
    if (document.activeElement !== message) message.textContent = state.message;
    message.hidden = !state.message;
    setEditing(event.data.editing);
  });

  function showModelError(error) {
    modelLoaded = false;
    modelStatus.textContent = "The 3D rose could not load. Check your connection and refresh.";
    console.error("[Paper Stish Rose] Uploaded GLB failed to load.", error);
  }

  if (!window.THREE) {
    modelStatus.textContent = "The 3D model library is unavailable. Refresh while connected to the internet.";
    window.parent.postMessage({ source: FRAME_SOURCE, type: "ready" }, "*");
    return;
  }

  const THREE = window.THREE;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    camera.position.set(0, 0, 7.3);
    camera.lookAt(0, 0, 0);
    scene.add(new THREE.HemisphereLight(0xffe8e2, 0x25100d, 1.7));
    const keyLight = new THREE.DirectionalLight(0xffeee8, 2.3);
    keyLight.position.set(-3, 4, 5);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xff4450, 1.1);
    rimLight.position.set(3, 1.5, -3);
    scene.add(rimLight);

    // This group is only a transform for the real GLB model, never generated rose geometry.
    rose = new THREE.Group();
    entrance = new THREE.Group();
    rose.add(entrance);
    scene.add(rose);

    function resize() {
      const width = Math.max(1, viewer.clientWidth);
      const height = Math.max(1, viewer.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener("resize", resize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

    if (!THREE.GLTFLoader) throw new Error("GLTFLoader was not loaded.");
    loader = new THREE.GLTFLoader();
    if (THREE.DRACOLoader) {
      const draco = new THREE.DRACOLoader();
      draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
      draco.setWorkerLimit(2);
      loader.setDRACOLoader(draco);
    }

    function loadRoseModel(modelUrl) {
      if (!loader || modelLoadAttempted || typeof modelUrl !== "string") return;
      modelLoadAttempted = true;
      let resolvedUrl;
      try {
        const parsed = new URL(modelUrl, document.baseURI);
        if (parsed.protocol !== "https:" && parsed.protocol !== "http:") throw new Error("Invalid model URL");
        resolvedUrl = parsed.href;
      } catch (error) {
        showModelError(error);
        return;
      }
      loader.load(resolvedUrl, (gltf) => {
        const model = gltf.scene;
        if (!model) { showModelError(new Error("GLB contains no scene.")); return; }
        model.traverse((object) => {
          if (!object.isMesh) return;
          object.castShadow = false;
          object.receiveShadow = false;
          if (object.material) {
            const materials = Array.isArray(object.material) ? object.material : [object.material];
            materials.forEach((material) => {
              material.side = THREE.DoubleSide;
              material.needsUpdate = true;
            });
          }
        });

        const bounds = new THREE.Box3().setFromObject(model);
        const size = bounds.getSize(new THREE.Vector3());
        if (!Number.isFinite(size.y) || size.y <= 0) { showModelError(new Error("GLB has invalid dimensions.")); return; }

        // Fit, center, then reveal the actual uploaded model with a short rise-and-scale animation.
        model.scale.setScalar(3.15 / size.y);
        model.updateMatrixWorld(true);
        const centeredBounds = new THREE.Box3().setFromObject(model);
        model.position.sub(centeredBounds.getCenter(new THREE.Vector3()));
        entrance.add(model);
        entrance.scale.setScalar(0.001);
        entrance.position.y = -0.65;
        entrance.rotation.x = -0.16;
        entranceStart = performance.now();
        modelLoaded = true;
        if (gltf.animations && gltf.animations.length && !prefersReducedMotion) {
          const mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
          rose.userData.mixer = mixer;
        }
      }, undefined, showModelError);
    }

    // Load the GLB even inside sandboxed preview iframes with an opaque origin.
    // There is intentionally NO procedural/fallback rose if this request fails.
    loadRoseModel(MODEL_URL);

    // The rose is intentionally not user-draggable; it rotates on its own after the entrance.

    const clock = new THREE.Clock();
    function render() {
      raf = requestAnimationFrame(render);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      if (modelLoaded) {
        // Hold the reference angle until the entrance animation ends, then spin automatically.
        if (!entranceStart && !prefersReducedMotion) rotateY += delta * 0.33;
        rose.rotation.y = rotateY;
        rose.rotation.x = rotateX + (prefersReducedMotion ? 0 : Math.sin(elapsed * 0.32) * 0.012);
        if (entranceStart) {
          const progress = Math.min(1, Math.max(0, (performance.now() - entranceStart) / 1250));
          const inverted = 1 - progress;
          const eased = 1 - inverted * inverted * inverted;
          entrance.scale.setScalar(Math.max(0.001, eased));
          entrance.position.y = -0.65 * inverted;
          entrance.rotation.x = -0.16 * inverted;
          if (progress >= 1) entranceStart = 0;
        }
        if (rose.userData.mixer) rose.userData.mixer.update(delta);
      }
      renderer.render(scene, camera);
    }
    render();
    setEditing(false);
    window.parent.postMessage({ source: FRAME_SOURCE, type: "ready" }, "*");
    window.addEventListener("pagehide", () => {
      cancelAnimationFrame(raf);
      if (renderer) renderer.dispose();
    });
  } catch (error) {
    showModelError(error);
    window.parent.postMessage({ source: FRAME_SOURCE, type: "ready" }, "*");
  }
})();
</script>
</body>
</html>
