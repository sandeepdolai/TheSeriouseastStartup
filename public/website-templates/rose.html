<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#200505">
<title>Rose — Paper Stish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--base:#200505;--text:#f5e8e4;--muted:#d1a7a1;--rose-glow:#79130f;--rose-mid:#470a08;--rose-dark:#250505;--rose-deep:#160202;--rose-accent:#ffd0c8;--rose-muted:#d1a7a1}
:root[data-rose-variant="blush"]{color-scheme:light;--text:#3b2430;--muted:#87586b;--rose-glow:#fff0f2;--rose-mid:#f8dce4;--rose-dark:#f1c8d6;--rose-deep:#e8b8ca;--rose-accent:#6f344d;--rose-muted:#87586b}
:root[data-rose-variant="noir"]{color-scheme:dark;--text:#f4eee7;--muted:#b7a99a;--rose-glow:#433a35;--rose-mid:#241f1e;--rose-dark:#11100f;--rose-deep:#070707;--rose-accent:#d6b785;--rose-muted:#b7a99a}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 42%,var(--rose-glow) 0,var(--rose-mid) 30%,var(--rose-dark) 63%,var(--rose-deep) 100%)}
.scene-wash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 20%,rgba(10,0,0,.12) 72%,rgba(0,0,0,.28) 100%)}
:root[data-rose-variant="blush"] .scene-wash{background:radial-gradient(ellipse at 50% 40%,transparent 20%,rgba(105,55,75,.08) 72%,rgba(105,55,75,.18) 100%)}
:root[data-rose-variant="blush"] .hint{color:rgba(73,39,55,.64)}
:root[data-rose-variant="blush"] .footer{color:rgba(73,39,55,.45)}
:root[data-rose-variant="blush"] .kicker{color:rgba(104,55,75,.72)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.layout{position:relative;display:block;width:100%;height:100%;min-height:100svh;padding:max(24px,env(safe-area-inset-top)) 20px max(26px,env(safe-area-inset-bottom))}
.viewer{position:absolute;z-index:1;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab;pointer-events:auto}
.viewer.dragging{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.box{position:absolute;z-index:2;left:50%;bottom:clamp(94px,11vh,170px);transform:translateX(-50%);width:min(340px,86vw);min-height:0;padding:24px 22px;border-radius:28px;text-align:center;background:rgba(20,3,3,.38);border:1px solid rgba(255,150,130,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 24px 60px rgba(0,0,0,.3);pointer-events:none;text-shadow:0 2px 24px rgba(10,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.box h1{margin:0;font-size:clamp(20px,5.2vw,25px);font-weight:600;letter-spacing:.025em;text-transform:none;padding:0;line-height:1.35;overflow-wrap:anywhere;outline:none!important;border:0}
.rose-message{max-width:30ch;margin:12px auto 0;color:var(--muted);font-size:clamp(13px,1.5vw,16px);font-weight:400;line-height:1.6;letter-spacing:.005em;outline:none!important;border:0}
.rose-card-layout .box{margin:0}
[contenteditable="true"],[contenteditable="true"]:focus,[contenteditable="true"]:focus-visible{pointer-events:auto;cursor:text;border:0;outline:none!important;box-shadow:none}
[contenteditable="false"]{outline:none;border:0;cursor:default}
.hint{position:absolute;z-index:3;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 36px);color:rgba(255,224,217,.55);font-size:9px;font-weight:500;letter-spacing:.18em;text-align:center;text-transform:uppercase;pointer-events:none}
.footer{position:absolute;z-index:3;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;color:rgba(255,218,210,.33);font-size:8px;letter-spacing:.2em;text-transform:uppercase;pointer-events:none}
@media(max-height:600px){.box{bottom:clamp(76px,8vh,110px);padding:18px 18px}.hint{top:14px}.footer{bottom:6px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="scene-wash" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<div class="layout rose-card-layout">
  <div class="viewer" id="viewer" aria-label="Interactive three-dimensional rose. Drag to rotate."><canvas id="roseCanvas"></canvas></div>
  <div class="hint" id="hint">A rose, just for you · drag to turn</div>
  <main class="box">
    <h1 id="roseHeading">We’re sorry, sir. Your order will be delivered shortly.</h1>
    <p class="rose-message" id="roseMessage" hidden></p>
  </main>
  <div class="footer">Made with Paper Stish</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
(() => {
  const FRAME_SOURCE = "paper-stish-rose";
  const PARENT_SOURCE = "paper-stish-rose-parent";
  const heading = document.getElementById("roseHeading");
  const message = document.getElementById("roseMessage");
  const hint = document.getElementById("hint");
  let editing = false;
  const state = { heading: "We’re sorry, sir. Your order will be delivered shortly.", message: "", variant: "classic" };
  const VARIANT_THEMES = {
    classic: { background: "radial-gradient(ellipse at 50% 42%,#79130f 0,#470a08 30%,#250505 63%,#160202 100%)", glow:"#79130f", mid:"#470a08", dark:"#250505", deep:"#160202", text:"#f5e8e4", muted:"#d1a7a1", accent:"#ffd0c8", fog:0x310707, sky:0xffd9d3, ground:0x160b08, key:0xffd2c8, rim:0xff3e31, fill:0x6b0b14 },
    blush: { background: "radial-gradient(ellipse at 50% 42%,#fff0f2 0,#f8dce4 30%,#f1c8d6 63%,#e8b8ca 100%)", glow:"#fff0f2", mid:"#f8dce4", dark:"#f1c8d6", deep:"#e8b8ca", text:"#3b2430", muted:"#87586b", accent:"#6f344d", fog:0xf6dfe6, sky:0xfff4f0, ground:0x8a6273, key:0xffe7e9, rim:0xe8a1b7, fill:0xb47e9b },
    noir: { background: "radial-gradient(ellipse at 50% 42%,#433a35 0,#241f1e 30%,#11100f 63%,#070707 100%)", glow:"#433a35", mid:"#241f1e", dark:"#11100f", deep:"#070707", text:"#f4eee7", muted:"#b7a99a", accent:"#d6b785", fog:0x171312, sky:0xd4c7b6, ground:0x090909, key:0xffe2bf, rim:0xd6a45d, fill:0x62423b }
  };
  let sceneRef = null, keyLightRef = null, rimLightRef = null, fillLightRef = null, hemiLightRef = null;
  function applyVariant(value) {
    const name = Object.prototype.hasOwnProperty.call(VARIANT_THEMES, value) ? value : "classic";
    const theme = VARIANT_THEMES[name];
    state.variant = name;
    document.documentElement.dataset.roseVariant = name;
    document.documentElement.style.setProperty("--rose-glow", theme.glow);
    document.documentElement.style.setProperty("--rose-mid", theme.mid);
    document.documentElement.style.setProperty("--rose-dark", theme.dark);
    document.documentElement.style.setProperty("--rose-deep", theme.deep);
    document.documentElement.style.setProperty("--text", theme.text);
    document.documentElement.style.setProperty("--muted", theme.muted);
    document.documentElement.style.setProperty("--rose-muted", theme.muted);
    document.documentElement.style.setProperty("--rose-accent", theme.accent);
    document.body.style.background = theme.background;
    if (sceneRef && sceneRef.fog) sceneRef.fog.color.setHex(theme.fog);
    if (hemiLightRef) { hemiLightRef.color.setHex(theme.sky); hemiLightRef.groundColor.setHex(theme.ground); }
    if (keyLightRef) keyLightRef.color.setHex(theme.key);
    if (rimLightRef) rimLightRef.color.setHex(theme.rim);
    if (fillLightRef) fillLightRef.color.setHex(theme.fill);
  }
  applyVariant(new URLSearchParams(window.location.search).get("variant") || "classic");

  function setEditing(value) {
    editing = value === true;
    [heading, message].forEach((element) => {
      element.contentEditable = editing ? "true" : "false";
      element.setAttribute("aria-readonly", editing ? "false" : "true");
      element.setAttribute("spellcheck", editing ? "true" : "false");
    });
    hint.textContent = editing ? "Tap a text line to personalize it" : "A rose, just for you · drag to turn";
  }

  function reportChange() {
    if (!editing) return;
    state.heading = (heading.textContent || "We’re sorry, sir. Your order will be delivered shortly.").replace(/[\r\n]+/g, " ").trim().slice(0, 120);
    state.message = (message.textContent || "").replace(/[\r\n]+/g, " ").trim().slice(0, 400);
    window.parent.postMessage({ source: FRAME_SOURCE, type: "change", heading: state.heading, message: state.message }, "*");
  }

  heading.addEventListener("input", reportChange);
  message.addEventListener("input", reportChange);
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent || !event.data || event.data.source !== PARENT_SOURCE) return;
    if (event.data.type !== "set-state") return;
    state.heading = typeof event.data.heading === "string" ? event.data.heading.slice(0,120) : "We’re sorry, sir. Your order will be delivered shortly.";
    state.message = typeof event.data.message === "string" ? event.data.message.slice(0,400) : "";
    if (typeof event.data.variant === "string") applyVariant(event.data.variant);
    if (typeof event.data.modelUrl === "string") loadSharedRoseModel(event.data.modelUrl);
    if (document.activeElement !== heading) heading.textContent = state.heading;
    if (document.activeElement !== message) message.textContent = state.message;
    message.hidden = !state.message;
    setEditing(event.data.editing);
  });

  if (!window.THREE) {
    hint.textContent = "This template needs an internet connection to load its 3D rose";
    window.parent.postMessage({ source: FRAME_SOURCE, type: "ready" }, "*");
    return;
  }

  const THREE = window.THREE;
  const canvas = document.getElementById("roseCanvas");
  const viewer = document.getElementById("viewer");
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;

  const scene = new THREE.Scene();
  sceneRef = scene;
  scene.fog = new THREE.FogExp2(VARIANT_THEMES[state.variant].fog, 0.052);
  const camera = new THREE.PerspectiveCamera(33, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.0, 7.8);
  camera.lookAt(0, 0.45, 0);

  const theme = VARIANT_THEMES[state.variant];
  const hemisphere = new THREE.HemisphereLight(theme.sky, theme.ground, 1.35); scene.add(hemisphere); hemiLightRef = hemisphere;
  const key = new THREE.DirectionalLight(theme.key, 2.2); key.position.set(-3, 5, 5); scene.add(key); keyLightRef = key;
  const rim = new THREE.PointLight(theme.rim, 1.65, 12); rim.position.set(3, 2.4, -2); scene.add(rim); rimLightRef = rim;
  const fill = new THREE.PointLight(theme.fill, 1.1, 10); fill.position.set(-4, -0.6, 3); scene.add(fill); fillLightRef = fill;

  const rose = new THREE.Group();
  scene.add(rose);
  const fallbackRose = new THREE.Group();
  rose.add(fallbackRose);

  function petalGeometry(length, halfWidth, cup, twist) {
    const segU = 24, segV = 16;
    const positions = [], colors = [], indices = [];
    const colorBase = new THREE.Color();
    for (let i = 0; i <= segU; i++) {
      const u = i / segU;
      const w = halfWidth * Math.pow(Math.sin(Math.PI * Math.pow(u, .82)), .72) * (.64 + .36*u);
      for (let j = 0; j <= segV; j++) {
        const v = j / segV * 2 - 1;
        const x = length * u;
        const z = v * w;
        const y = cup * Math.sin(Math.PI*u) + .10 * Math.pow(Math.abs(v), 1.8) * u + twist * v * Math.sin(Math.PI*u);
        positions.push(x, y, z);
        const shade = .58 + .42*u - .18*Math.abs(v) + .035*Math.sin(i*1.7+j*.9);
        colorBase.setHSL(.985 - .018*u, .76 + .12*u, Math.max(.16, Math.min(.66, shade*.49)));
        colors.push(colorBase.r, colorBase.g, colorBase.b);
      }
    }
    for (let i=0; i<segU; i++) for (let j=0; j<segV; j++) {
      const a=i*(segV+1)+j,b=a+segV+1;
      indices.push(a,b,a+1,b,b+1,a+1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(positions,3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(colors,3));
    g.setIndex(indices); g.computeVertexNormals();
    return g;
  }

  function addPetal(length, width, angle, radius, y, color, options={}) {
    const mesh = new THREE.Mesh(
      petalGeometry(length, width, options.cup ?? .16, options.twist ?? .04),
      new THREE.MeshStandardMaterial({
        color: 0xffffff, vertexColors:true, roughness: options.roughness ?? .43, metalness:.03,
        side:THREE.DoubleSide, emissive: new THREE.Color(color).multiplyScalar(.035)
      })
    );
    mesh.position.set(Math.cos(angle)*radius, y, Math.sin(angle)*radius);
    mesh.rotation.y = -angle;
    mesh.rotation.z = options.tilt ?? 0;
    mesh.rotation.x = options.roll ?? 0;
    fallbackRose.add(mesh);
  }

  // Layered, individually curved petals make a slowly turning sculptural rose.
  const outer = ["#7f0c16","#a10d1b","#bd1823","#8e0b15","#c51d27","#78101a","#a91420"];
  for (let i=0;i<7;i++) addPetal(1.16,.47,i*Math.PI*2/7+.16,.18,.36+Math.sin(i*1.4)*.04,outer[i],{cup:.25,tilt:(i%2?-.12:.06),twist:.09,roughness:.5});
  const mid = ["#d0202d","#b51221","#e02a35","#a20d1a","#c51c2a","#ed3c41","#b91624"];
  for (let i=0;i<7;i++) addPetal(.91,.38,i*Math.PI*2/7+.54,.10,.48+Math.cos(i*1.8)*.035,mid[i],{cup:.22,tilt:(i%2?.08:-.1),twist:.075,roughness:.4});
  const inner = ["#e5323b","#bd111f","#f34b4a","#cf1828","#d52231","#a90e1c"];
  for (let i=0;i<6;i++) addPetal(.65,.285,i*Math.PI/3+.25,.045,.58+Math.sin(i*2)*.025,inner[i],{cup:.18,tilt:.12,twist:.07,roughness:.36});
  for (let i=0;i<4;i++) addPetal(.39,.19,i*Math.PI/2+.4,.018,.64,"#dc2632",{cup:.14,tilt:.15,twist:.05,roughness:.34});

  // Stem and leaves.
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.045,.075,2.65,16),new THREE.MeshStandardMaterial({color:0x34583b,roughness:.78}));
  stem.position.set(0,-.98,0); stem.rotation.z=-.025; fallbackRose.add(stem);
  function makeLeaf(length,width) {
    const g = new THREE.BufferGeometry(),p=[],c=[],ix=[];
    const base=new THREE.Color(0x416a42),light=new THREE.Color(0x7c985b);
    const nu=18,nv=10;
    for(let i=0;i<=nu;i++){const u=i/nu;for(let j=0;j<=nv;j++){
      const v=j/nv*2-1, w=width*Math.pow(Math.sin(Math.PI*u),.72);
      p.push(length*u, .12*Math.sin(Math.PI*u)+.08*(1-v*v)*Math.sin(Math.PI*u), v*w);
      const cc=base.clone().lerp(light,u*.78); c.push(cc.r,cc.g,cc.b);
    }}
    for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+nv+1;ix.push(a,b,a+1,b,b+1,a+1)}
    g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));g.setAttribute("color",new THREE.Float32BufferAttribute(c,3));g.setIndex(ix);g.computeVertexNormals();
    return g;
  }
  function addLeaf(angle,y,length,width,tilt) {
    const leaf=new THREE.Mesh(makeLeaf(length,width),new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:.68}));
    leaf.position.set(Math.cos(angle)*.06,y,Math.sin(angle)*.06);
    leaf.rotation.y=-angle;leaf.rotation.z=tilt;fallbackRose.add(leaf);
    const vein=new THREE.Mesh(new THREE.CylinderGeometry(.006,.012,length*.78,5),new THREE.MeshStandardMaterial({color:0x9ba66a,roughness:.7}));
    vein.position.set(leaf.position.x+Math.cos(angle)*length*.39,y+.1,leaf.position.z+Math.sin(angle)*length*.39);
    vein.rotation.z=tilt+.1;vein.rotation.y=-angle;fallbackRose.add(vein);
  }
  addLeaf(-.68,-.98,1.1,.24,-.35); addLeaf(2.52,-1.45,.95,.22,.42);
  const calyx = new THREE.Mesh(new THREE.ConeGeometry(.25,.42,7),new THREE.MeshStandardMaterial({color:0x315236,roughness:.72}));
  calyx.position.set(0,-.37,0);calyx.rotation.x=Math.PI;fallbackRose.add(calyx);
  fallbackRose.position.y=0;
  fallbackRose.rotation.x=-.07;

  let down=false, moved=false, startX=0,startY=0,lastX=0,lastY=0,rotateX=-.07,rotateY=0,velocityY=0;
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let modelMixer = null;
  let sharedModelLoader = null;
  let modelLoadAttempted = false;

  // The sandboxed editor iframe has an opaque origin. Its parent passes the
  // site's /models/rose.glb URL; a directly opened template resolves the same
  // asset from its own deployment origin. Every variant reuses this single file.
  function loadSharedRoseModel(modelUrl) {
    if (!sharedModelLoader || modelLoadAttempted || typeof modelUrl !== "string") return;
    let resolvedUrl;
    try {
      const parsed = new URL(modelUrl, document.baseURI);
      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return;
      resolvedUrl = parsed.href;
    } catch {
      return;
    }
    modelLoadAttempted = true;
    sharedModelLoader.load(resolvedUrl, (gltf) => {
      const model = gltf.scene;
      model.traverse((object) => {
        if (!object.isMesh) return;
        object.castShadow = false;
        object.receiveShadow = false;
        if (object.material) {
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          for (const material of materials) {
            material.side = THREE.DoubleSide;
            material.needsUpdate = true;
          }
        }
      });
      const bounds = new THREE.Box3().setFromObject(model);
      const size = bounds.getSize(new THREE.Vector3());
      if (!Number.isFinite(size.y) || size.y <= 0) {
        console.warn("[Paper Stish Rose] Model has invalid bounds; keeping fallback rose.");
        return;
      }
      model.scale.setScalar(3.35 / size.y);
      model.updateMatrixWorld(true);
      const centeredBounds = new THREE.Box3().setFromObject(model);
      const center = centeredBounds.getCenter(new THREE.Vector3());
      model.position.sub(center);
      model.position.y += .08;
      rose.add(model);
      fallbackRose.visible = false;
      if (!prefersReducedMotion && gltf.animations?.length) {
        modelMixer = new THREE.AnimationMixer(model);
        modelMixer.clipAction(gltf.animations[0]).play();
      }
    }, undefined, (error) => {
      fallbackRose.visible = true;
      console.warn("[Paper Stish Rose] Shared GLB could not load; using fallback rose.", error);
    });
  }

  if (THREE.GLTFLoader && THREE.DRACOLoader) {
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
    dracoLoader.setWorkerLimit(2);
    dracoLoader.preload();
    sharedModelLoader = new THREE.GLTFLoader();
    sharedModelLoader.setDRACOLoader(dracoLoader);
    if (window.location.origin !== "null") {
      loadSharedRoseModel("https://res.cloudinary.com/cmtfrr9s/image/upload/v1793144811/rose_2.glb");
    }
  } else {
    console.warn("[Paper Stish Rose] GLTFLoader/DRACOLoader unavailable; using fallback rose.");
  }
  viewer.addEventListener("pointerdown",(e)=>{if(editing && e.target.closest(".box"))return;down=true;moved=false;startX=lastX=e.clientX;startY=lastY=e.clientY;viewer.classList.add("dragging");viewer.setPointerCapture?.(e.pointerId)});
  viewer.addEventListener("pointermove",(e)=>{if(!down)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>3)moved=true;rotateY+=dx*.009;rotateX=Math.max(-.52,Math.min(.42,rotateX+dy*.004));velocityY=dx*.0015;lastX=e.clientX;lastY=e.clientY});
  function endDrag(){down=false;viewer.classList.remove("dragging")}
  viewer.addEventListener("pointerup",endDrag);viewer.addEventListener("pointercancel",endDrag);viewer.addEventListener("lostpointercapture",endDrag);

  let raf=0;
  function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.z=h<560?8.6:7.8;camera.updateProjectionMatrix()}
  window.addEventListener("resize",resize);
  const clock=new THREE.Clock();
  function render(){
    raf=requestAnimationFrame(render);
    const dt=clock.getDelta();
    const t=clock.elapsedTime;
    if(!down && !prefersReducedMotion) { rotateY+=.0021+velocityY;velocityY*=.94; }
    rose.rotation.y=rotateY;
    rose.rotation.x=rotateX+(prefersReducedMotion ? 0 : Math.sin(t*.32)*.018);
    rose.position.y=.32+(prefersReducedMotion ? 0 : Math.sin(t*.68)*.035);
    if(modelMixer) modelMixer.update(dt);
    renderer.render(scene,camera);
  }
  render();
  setEditing(false);
  window.parent.postMessage({source:FRAME_SOURCE,type:"ready"},"*");
  window.addEventListener("pagehide",()=>{cancelAnimationFrame(raf);renderer.dispose()});
})();
</script>
